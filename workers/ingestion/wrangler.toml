# Ingestion Worker Configuration
# Fetches air quality data from WAQI and stores in D1

name = "aqi-ingestion"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Scheduled triggers (max 5 allowed on free plan)
# Ingestion: 3x per hour at :00, :20, :40
# Maintenance: Runs during the :00 trigger at 19:00 UTC (00:30 IST)
#   Daily: Cleanup old snapshots (keep 7 days)  
#   2nd of month: Monthly aggregation
[triggers]
crons = ["0 * * * *", "20 * * * *", "40 * * * *"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "aqi-historical"
database_id = "fd2739c3-9278-46ea-a4e3-b5cb357c1195"

# Environment variables (secrets should be set via `wrangler secret put`)
[vars]
# Non-sensitive config can go here

# For local development
[env.dev]
name = "aqi-ingestion-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "aqi-historical-dev"
database_id = "" # Fill in after creating dev database
